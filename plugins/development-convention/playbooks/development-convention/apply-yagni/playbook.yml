version: 2
name: apply-yagni
description: いまの資料とテストが呼ばない公開シンボルを作らない・残さない。同名の内部skillへ1工程でルーティングする独立プレイブック
instructions:
  execution:
    directive: 対応する内部skillだけを実行し、他の関心の規約を暗黙に適用しない
focus: current-public-surface-reduction
requires: []
contract:
  inputs: [request, target_repository, target_scope, canonical_artifacts, derived_tests, public_symbols]
  excluded_concerns: [requirements_addition, future_value_prediction, layer_design, general_code_review]
  outcome:
    result: ${yagni_result}
steps:
  - id: apply
    skill: apply-yagni
    purpose: 資料に無い公開シンボルを作らず残さない
    needs: [request, target_repository, target_scope, canonical_artifacts, derived_tests, public_symbols]
    provides: [yagni_result]

version: 2
name: develop-inside-out
description: BDD 資料のテストをゲートにして、受け入れテストから始めドメイン → リポジトリ → ユースケース → ハンドラーの順に実装する。同名の内部skillへ1工程でルーティングする独立プレイブック
instructions:
  execution:
    directive: 対応する内部skillだけを実行し、他の関心の規約を暗黙に適用しない
focus: inside-out-feature-delivery
requires: []
contract:
  inputs: [request, target_repository, user_journey_bdd, domain_rule, domain_model, rdb_logical_data_modeling, existing_code]
  excluded_concerns: [journey_discovery, domain_discovery, layer_redesign, speculative_feature_addition]
  outcome:
    result: ${implementation_result}
steps:
  - id: apply
    skill: develop-inside-out
    purpose: 一場面を内側から外へ層ごとのゲートを通して実装する
    needs: [request, target_repository, user_journey_bdd, domain_rule, domain_model, rdb_logical_data_modeling, existing_code]
    provides: [implementation_result]

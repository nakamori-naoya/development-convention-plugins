version: 2
name: protect-entry-points
description: 外部から呼べる入口を列挙し、入口ごとの認証・認可・利用上限・偽装要求への対策と下流の資源を宣言した資料を、同じagentが宣言順に作る。
inputs: [request, references, target_repository, document_destination, quality_requirements]
requires: []
steps:
  - id: enumerate-entry-points
    agent_work: invoking_agent
    purpose: "外部から呼べる入口をすべて列挙する"
  - id: read-current-protection
    agent_work: invoking_agent
    purpose: "入口ごとの現在の保護と下流の資源を読む"
  - id: declare-protection
    agent_work: invoking_agent
    purpose: "入口ごとの宣言と適用除外を決める"
  - id: write-declaration
    agent_work: invoking_agent
    purpose: "宣言の資料を保存する"
  - id: report
    agent_work: invoking_agent
    purpose: "無防備な入口と未決を報告する"

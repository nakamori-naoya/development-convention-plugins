version: 2
name: apply-yagni
description: 現在の根拠から公開面を同じagentが宣言順に評価して縮小する。
inputs: [request, target_repository, target_scope, canonical_artifacts, derived_tests, public_symbols]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: fix-current-sources
    agent_work: invoking_agent
    purpose: "現在の正本を固定する"
  - id: verify-source-test-trace
    agent_work: invoking_agent
    purpose: "資料とテストの対応を検査する"
  - id: classify-public-symbols
    agent_work: invoking_agent
    purpose: "公開シンボルを保持または拒否へ分類する"
  - id: reject-compatibility-surface
    agent_work: invoking_agent
    purpose: "互換用の公開面を拒否する"
  - id: apply-to-scope
    agent_work: invoking_agent
    purpose: "対象範囲へ適用する"
  - id: report-evidence-and-changes
    agent_work: invoking_agent
    purpose: "根拠と変更を報告する"

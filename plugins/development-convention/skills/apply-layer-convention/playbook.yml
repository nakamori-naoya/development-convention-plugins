version: 2
name: apply-layer-convention
description: 実装パターン、論理責務、依存の向き、整合性の置き場を、同じ agent が宣言順に決めて適用する。
inputs: [request, references, target_repository, target_scope, domain_rule, domain_model, rdb_logical_data_modeling, rdb_physical_design, existing_code]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: select-pattern
    agent_work: invoking_agent
    purpose: "実装パターンを選ぶ"
  - id: decide-logical-owners
    agent_work: invoking_agent
    purpose: "責務の持ち主と依存の向きを決める"
  - id: place-command-flow
    agent_work: invoking_agent
    purpose: "command の流れと、入力、時刻、採番の持ち主を置く"
  - id: place-invariants-and-transactions
    agent_work: invoking_agent
    purpose: "不変条件とトランザクションを置く"
  - id: contain-failures
    agent_work: invoking_agent
    purpose: "失敗の影響を閉じ込める範囲を決める"
  - id: apply-and-verify-dependencies
    agent_work: invoking_agent
    purpose: "適用して依存を検査する"

version: 2
name: apply-layer-convention
description: 論理責務と依存方向を同じagentが宣言順に適用する。
inputs: [request, references, target_repository, target_scope, domain_rule, domain_model, rdb_logical_data_modeling, existing_code]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: inventory-responsibilities
    agent_work: invoking_agent
    purpose: "責務と依存を棚卸しする"
  - id: separate-command-query
    agent_work: invoking_agent
    purpose: "CommandとQueryの経路を分ける"
  - id: decide-logical-owners
    agent_work: invoking_agent
    purpose: "論理所有者を確定する"
  - id: place-invariants-and-transactions
    agent_work: invoking_agent
    purpose: "不変条件とトランザクションを配置する"
  - id: apply-and-verify-dependencies
    agent_work: invoking_agent
    purpose: "適用して依存を検査する"

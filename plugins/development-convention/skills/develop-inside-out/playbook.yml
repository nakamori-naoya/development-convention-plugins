version: 2
name: develop-inside-out
description: 一つの場面を、同じ agent が宣言順に内側から外側へ実装する。
inputs: [request, references, target_repository, user_journey_bdd, domain_rule, domain_model, rdb_logical_data_modeling, rdb_physical_design, existing_code]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: write-acceptance-test
    agent_work: invoking_agent
    purpose: "一つの場面を一つの受け入れテストへ写す"
  - id: implement-domain
    agent_work: invoking_agent
    purpose: "ドメインを実装する"
  - id: implement-persistence-or-query
    agent_work: invoking_agent
    purpose: "永続化または読み取りを実装する"
  - id: implement-usecase
    agent_work: invoking_agent
    purpose: "usecase を実装する"
  - id: implement-handler-and-pass-acceptance
    agent_work: invoking_agent
    purpose: "入口を実装して受け入れを通す"
  - id: report-trace-and-gates
    agent_work: invoking_agent
    purpose: "追跡とゲートの結果を報告する"
